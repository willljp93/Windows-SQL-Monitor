[package]
name = "windows-sql-monitor"
version = "1.2.0"
description = "Windows-SQL Monitor: bandeja del sistema para Windows Server y SQL Server"
authors = ["William Jiménez Puentes <willjp93@gmail.com>"]
repository = "https://github.com/willljp93"
edition = "2021"

[lib]
name = "windows_sql_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security_Cryptography",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
