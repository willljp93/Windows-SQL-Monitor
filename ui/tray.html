<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows-SQL Monitor · Bandeja</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-body: #334155;
      --muted: #64748b;
      --ok-txt: #047857;
      --warn-txt: #b45309;
      --crit-txt: #b91c1c;
      --err-bg: #fef2f2;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    :root.dark {
      --surface: #0f172a;
      --surface-hover: #1e293b;
      --border: #1e293b;
      --border-strong: #334155;
      --text: #f1f5f9;
      --text-body: #cbd5e1;
      --muted: #94a3b8;
      --ok-txt: #34d399;
      --warn-txt: #fbbf24;
      --crit-txt: #f87171;
      --err-bg: rgba(239, 68, 68, 0.14);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--surface);
      color: var(--text);
      overflow-x: hidden;
      overflow-y: auto;
      user-select: none;
    }
    .popup {
      width: 100%;
      min-height: 100%;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      padding: 6px 0;
    }
    .mono { font-family: "Cascadia Mono", "Consolas", monospace; font-variant-numeric: tabular-nums; }
    .summary {
      padding: 8px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .srv-row { display: flex; flex-direction: column; gap: 2px; }
    .srv-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .srv-name { font-size: 12px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .srv-ping { font-size: 12px; flex-shrink: 0; }
    .srv-sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cpu-ram { font-size: 11px; color: var(--text-body); padding-top: 2px; }
    .ok-txt { color: var(--ok-txt); }
    .warn-txt { color: var(--warn-txt); }
    .crit-txt { color: var(--crit-txt); }
    .muted-txt { color: var(--muted); }
    .divider { height: 1px; background: var(--border); margin: 4px 0; }
    .menu-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    .menu-btn:hover { background: var(--surface-hover); }
    .menu-btn.muted { color: var(--text-body); }
    .menu-btn.danger { color: var(--muted); }
    .menu-btn.danger:hover { background: var(--err-bg); color: var(--crit-txt); }
    .menu-btn svg { width: 15px; height: 15px; flex-shrink: 0; stroke: var(--muted); }
    .menu-btn.danger:hover svg { stroke: var(--crit-txt); }
  </style>
</head>
<body>
  <div class="popup">
    <div id="summaryBox" class="summary"></div>
    <div class="divider"></div>
    <button type="button" class="menu-btn" onclick="openConfig()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      <span>Abrir configuración y tiempos</span>
    </button>
    <button type="button" class="menu-btn" onclick="probeNow()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span>Ejecutar sondeo ahora</span>
    </button>
    <button type="button" class="menu-btn" onclick="togglePause()">
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      <span id="pauseLabel">Pausar monitorización</span>
    </button>
    <div class="divider"></div>
    <button type="button" class="menu-btn muted" onclick="hidePopup()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span>Ocultar menú de bandeja</span>
    </button>
    <button type="button" class="menu-btn danger" onclick="quitApp()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      <span>Salir</span>
    </button>
  </div>

  <script>
    var invoke = window.__TAURI__.core.invoke;
    var themeMedia = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function applyTheme(forcedMode) {
      var mode = forcedMode || localStorage.getItem('wsm-theme-mode') || 'system';
      var isDark = mode === 'dark' || (mode === 'system' && themeMedia && themeMedia.matches);
      document.documentElement.classList.toggle('dark', !!isDark);
    }

    function esc(v) {
      return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function refreshPopup() {
      applyTheme();
      try {
        var snap = await invoke('get_tray_snapshot');
        var box = document.getElementById('summaryBox');
        var html = '';
        for (var i = 0; i < snap.servers.length; i++) {
          var s = snap.servers[i];
          var cls = s.status === 'nominal' ? 'ok-txt' : s.status === 'warning' ? 'warn-txt' : s.status === 'critical' ? 'crit-txt' : 'muted-txt';
          html += '<div class="srv-row">' +
            '<div class="srv-top">' +
              '<span class="srv-name">' + esc(s.label) + '</span>' +
              '<span class="srv-ping mono ' + cls + '">' + esc(s.ping_text) + '</span>' +
            '</div>' +
            '<div class="srv-sub mono">' + esc(s.host) + ':' + s.port + ' · ' + esc(s.status_text) + '</div>' +
          '</div>';
        }
        if (snap.active_cpu_ram) {
          html += '<div class="cpu-ram mono">' + esc(snap.active_cpu_ram) + '</div>';
        }
        box.innerHTML = html;

        var pauseLbl = document.getElementById('pauseLabel');
        var pauseSvg = document.getElementById('pauseIcon');
        if (pauseLbl) pauseLbl.textContent = snap.paused ? 'Reanudar monitorización' : 'Pausar monitorización';
        if (pauseSvg) {
          pauseSvg.innerHTML = snap.paused
            ? '<polygon points="5 3 19 12 5 21 5 3"/>'
            : '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        }
      } catch (e) {}
    }

    async function openConfig() {
      await invoke('cmd_open_main_tab', { tab: 'config' });
    }

    async function probeNow() {
      hidePopup();
      await invoke('run_probe_now');
    }

    async function togglePause() {
      await invoke('toggle_paused');
      await refreshPopup();
    }

    function hidePopup() {
      try {
        window.__TAURI__.window.getCurrentWindow().hide();
      } catch (e) {}
    }

    async function quitApp() {
      await invoke('cmd_quit_app');
    }

    if (themeMedia && themeMedia.addEventListener) {
      themeMedia.addEventListener('change', function() { applyTheme(); });
    }
    window.addEventListener('storage', function() { applyTheme(); });
    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen('tray-refresh', function() { refreshPopup(); });
      window.__TAURI__.event.listen('probe-updated', function() { refreshPopup(); });
      window.__TAURI__.event.listen('theme-changed', function(ev) { applyTheme(ev && ev.payload); });
    }
    applyTheme();
    refreshPopup();
  </script>
</body>
</html>
